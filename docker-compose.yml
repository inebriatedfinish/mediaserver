---
name: ezarr
services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${BAZARR_UID}
      - PGID=${MEDIACENTER_GID}
      - TZ=${TIMEZONE}
    volumes:
      - ${CONFIG_DIR}/bazarr-config:/config
      - ${DATA_DIR}/data/media:/media
    ports:
      - "6767:6767"
    restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${UID}
      - PGID=${MEDIACENTER_GID}
      - UMASK=007
      - TZ=${TIMEZONE}
    volumes:
      - ${CONFIG_DIR}/jellyfin-config:/config
      - ${DATA_DIR}/data/media:/data
    ports:
      - "8096:8096"
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:develop
    container_name: prowlarr
    environment:
      - PUID=${PROWLARR_UID}
      - PGID=${MEDIACENTER_GID}
      - UMASK=007
      - TZ=${TIMEZONE}
    volumes:
      - ${CONFIG_DIR}/prowlarr-config:/config
    ports:
      - "9696:9696"
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${RADARR_UID}
      - PGID=${MEDIACENTER_GID}
      - UMASK=007
      - TZ=${TIMEZONE}
    volumes:
      - ${CONFIG_DIR}/radarr-config:/config
      - ${DATA_DIR}/data:/data
    ports:
      - "7878:7878"
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    environment:
      # Seerr does not recommend using non-default UID/GID.
      # See the migration documentation and GitHub Issue:
      # https://docs.seerr.dev/migration-guide/?kubernetes-values=old#config-folder-permissions
      # https://github.com/seerr-team/seerr/discussions/2455
      - TZ=${TIMEZONE}
      - LOG_LEVEL=debug
    volumes:
      - ${CONFIG_DIR}/seerr-config:/app/config
    ports:
      - "5055:5055"
    restart: unless-stopped

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    environment:
      - PUID=${SABNZBD_UID}
      - PGID=${MEDIACENTER_GID}
      - UMASK=007
      - TZ=${TIMEZONE}
    volumes:
      - ${CONFIG_DIR}/sabnzbd-config:/config
      - ${DATA_DIR}/data/usenet:/data/usenet:rw
    ports:
      - "8081:8080"
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${SONARR_UID}
      - PGID=${MEDIACENTER_GID}
      - UMASK=007
      - TZ=${TIMEZONE}
    volumes:
      - ${CONFIG_DIR}/sonarr-config:/config
      - ${DATA_DIR}/data:/data
    ports:
      - "8989:8989"
    restart: unless-stopped

  # flaresolverr:
